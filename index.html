<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">

  <title>Full Settlement</title>

  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f3f4f6;
      --accent: #111827;
      --accent-soft: #eef0f3;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      margin: 0;
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 18px 14px 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .title {
      margin: 0;
      font-size: 26px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--text);
      cursor: pointer;
      padding: 0;
    }

    .icon-btn:active {
      background: var(--soft);
    }

    .icon-btn svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 750;
      margin: 0 0 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    label {
      display: block;
      min-width: 0;
    }

    .label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .money-wrap,
    .suffix-wrap {
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      display: flex;
      align-items: center;
      padding: 0 13px;
    }

    .money-wrap:focus-within,
    .suffix-wrap:focus-within,
    .field:focus {
      border-color: #9ca3af;
      box-shadow: 0 0 0 3px #f0f1f3;
    }

    .money-symbol,
    .suffix {
      color: var(--muted);
      flex: 0 0 auto;
    }

    .money-symbol {
      margin-right: 8px;
    }

    .suffix {
      margin-left: 8px;
      font-size: 13px;
    }

    .bare-input {
      width: 100%;
      min-width: 0;
      padding: 12px 0;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 16px;
      color: var(--text);
    }

    .field {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      padding: 0 12px;
      outline: none;
      color: var(--text);
      font-size: 16px;
    }

    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .seg label {
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 13px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 11px;
      background: #fff;
      cursor: pointer;
    }

    .seg input {
      width: 18px;
      height: 18px;
      margin: 0;
      flex: 0 0 auto;
    }

    .seg-text {
      font-size: 12px;
      line-height: 1.2;
    }

    .seg-text strong {
      font-size: 13px;
    }

    .date-grid {
      display: grid;
      grid-template-columns: 0.75fr 1.15fr 0.9fr;
      gap: 8px;
    }

    .date-caption {
      margin: 0 0 4px 2px;
      font-size: 11px;
      color: var(--muted);
    }

    .fee-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .fee-btn {
      min-height: 46px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 13px;
      font-weight: 750;
      cursor: pointer;
    }

    .fee-btn.active {
      border-color: #6b7280;
      background: var(--accent-soft);
    }

    .admin-base {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .admin-base label {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      background: #fff;
      overflow: hidden;
    }

    .admin-base input {
      width: 17px;
      height: 17px;
      margin: 0;
      flex: 0 0 auto;
    }

    .admin-base span {
      min-width: 0;
      font-size: 11px;
      line-height: 1.15;
      white-space: nowrap;
    }

    .date-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px;
      background: #fff;
    }

    .date-card-title {
      font-size: 13px;
      font-weight: 750;
      margin-bottom: 10px;
    }

    .result-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 15px;
      background: #fff;
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .result-date {
      margin-top: 2px;
      font-size: 14px;
      font-weight: 750;
    }

    .badge {
      padding: 5px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .rows {
      display: grid;
      gap: 9px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .row span:first-child {
      color: var(--muted);
    }

    .row strong {
      text-align: right;
    }

    .total {
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
    }

    .total-label {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .total-value {
      margin-top: 3px;
      font-size: 24px;
      font-weight: 800;
    }

    .note {
      padding: 11px 12px;
      border-radius: 13px;
      background: var(--soft);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .error {
      display: none;
      margin-bottom: 14px;
      padding: 10px 11px;

    <div style="height:14px"></div>

    <div class="label">Loan start date</div>

    <div class="date-grid">

      <label>
        <div class="date-caption">Day</div>
        <select id="startDay" class="field"></select>
      </label>

      <label>
        <div class="date-caption">Month</div>
        <select id="startMonth" class="field"></select>
      </label>

      <label>
        <div class="date-caption">Year</div>
        <select id="startYear" class="field"></select>
      </label>

    </div>

  </section>

  <section class="card">

    <h2 class="section-title">Fees</h2>

    <div class="label">Admin fee</div>

    <div class="fee-row">

      <button
        type="button"
        class="fee-btn active"
        data-admin="1"
      >
        1%
      </button>

      <button
        type="button"
        class="fee-btn"
        data-admin="1.5"
      >
        1.5%
      </button>

      <button
        type="button"
        class="fee-btn"
        data-admin="other"
      >
        Other
      </button>

    </div>

    <div
      id="customAdminRow"
      class="hidden"
      style="margin-top:8px"
    >

      <div class="suffix-wrap">

        <input
          id="customAdminRate"
          class="bare-input"
          inputmode="decimal"
          type="number"
          min="0"
          step="0.1"
          placeholder="Enter admin fee"
        />

        <span class="suffix">%</span>

      </div>

    </div>

    <div style="height:12px"></div>

    <div class="label">Admin fee based on</div>

    <div class="admin-base">

      <label>

        <input
          type="radio"
          name="adminBase"
          value="original"
          checked
        />

        <span>Original loan amount</span>

      </label>

      <label>

        <input
          type="radio"
          name="adminBase"
          value="outstanding"
        />

        <span>Outstanding principal</span>

      </label>

    </div>

  </section>

  <section class="card">

    <h2 class="section-title">Compare settlement dates</h2>

    <div class="grid desktop-two">

      <div class="date-card">

        <div class="date-card-title">
          Settlement date 1
        </div>

        <div class="date-grid">

          <label>
            <div class="date-caption">Day</div>
            <select id="settle1Day" class="field"></select>
          </label>

          <label>
            <div class="date-caption">Month</div>
            <select id="settle1Month" class="field"></select>
          </label>

          <label>
            <div class="date-caption">Year</div>
            <select id="settle1Year" class="field"></select>
          </label>

        </div>

      </div>

      <div class="date-card">

        <div class="date-card-title">
          Settlement date 2
        </div>

        <div class="date-grid">

          <label>
            <div class="date-caption">Day</div>
            <select id="settle2Day" class="field"></select>
          </label>

          <label>
            <div class="date-caption">Month</div>
            <select id="settle2Month" class="field"></select>
          </label>

          <label>
            <div class="date-caption">Year</div>
            <select id="settle2Year" class="field"></select>
          </label>

        </div>

      </div>

    </div>

  </section>

  <div
    id="errorBox"
    class="error"
    role="alert"
  ></div>

  <section
    class="grid desktop-two"
    style="margin-bottom:14px"
  >

    <article class="result-card">

      <div class="result-head">

        <div>

          <div class="eyebrow">
            Date 1
          </div>

          <div
            id="resultDate1"
            class="result-date"
          >
            Select a settlement day
          </div>

        </div>

      </div>

      <div class="rows">

        <div class="row">
          <span>Instalments paid</span>
          <strong id="paid1">—</strong>
        </div>

        <div class="row">
          <span>Remaining months</span>
          <strong id="remaining1">—</strong>
        </div>

        <div class="row">
          <span>Outstanding principal</span>
          <strong id="outstanding1">—</strong>
        </div>

        <div class="row">
          <span>Rule 78 rebate</span>
          <strong id="rebate1">—</strong>
        </div>

        <div class="row">
          <span>Early settlement charge (20%)</span>
          <strong id="charge1">—</strong>
        </div>

        <div class="row">
          <span>Admin fee</span>
          <strong id="admin1">—</strong>
        </div>

      </div>

      <div class="total">

        <div class="total-label">
          Estimated full settlement
        </div>

        <div
          id="total1"
          class="total-value"
        >
          —
        </div>

      </div>

    </article>

    <article class="result-card">

      <div class="result-head">

        <div>

          <div class="eyebrow">
            Date 2
          </div>

          <div
            id="resultDate2"

          >
            Select a settlement day
          </div>

        </div>

        <div
          id="differenceBadge"

        ></div>

      </div>

      <div class="rows">

        <div class="row">

        </div>

        <div class="row">

        </div>

        <div class="row">

          <strong id="outstanding2">—</strong>
        </div>

        <div class="row">
          <span>Rule 78 rebate</span>
          <strong id="rebate2">—</strong>
        </div>

        <div class="row">
          <span>Early settlement charge (20%)</span>
          <strong id="charge2">—</strong>
        </div>

        <div class="row">
          <span>Admin fee</span>
          <strong id="admin2">—</strong>
        </div>

      </div>

      <div class="total">

        <div class="total-label">
          Estimated full settlement
        </div>

        <div
          id="total2"
          class="total-value"
        >
          —
        </div>

      </div>

    </article>

  </section>

  <section class="card">

    <div class="actions">

      <button
        id="clearBtn"
        class="btn"
        type="button"
      >
        Clear
      </button>

    </div>

  </section>

  <div class="note">
    Estimate only. Actual redemption figures may differ due to bank repayment cut-off dates, settlement notice periods, instalment timing, rounding and contractual charges.
  </div>

</main>

<script>

(() => {

  const $ = (id) =>
    document.getElementById(id);

  const now =
    new Date();

  const CURRENT_MONTH =
    now.getMonth() + 1;

  const CURRENT_YEAR =
    now.getFullYear();

  const MONTHS = [
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec"
  ];

  const EARLY_SETTLEMENT_CHARGE_RATE =
    0.20;

  let adminChoice =
    1;


  function fillDays(id) {

    const el =
      $(id);

    el.innerHTML =
      '<option value="">Day</option>';

    for (
      let d = 1;
      d <= 31;
      d++
    ) {

      const option =
        document.createElement("option");

      option.value =
        String(d);

      option.textContent =
        String(d);

      el.appendChild(option);

    }

  }


  function fillMonths(
    id,
    selected = null
  ) {

    const el =
      $(id);

    el.innerHTML =
      '<option value="">Month</option>';

    MONTHS.forEach(
      (name, index) => {

        const option =
          document.createElement("option");

        option.value =
          String(index + 1);

        option.textContent =
          name;

        if (
          selected === index + 1
        ) {
          option.selected = true;
        }

        el.appendChild(option);

      }
    );

  }


  function fillStartYears() {

    const el =
      $("startYear");

    el.innerHTML =
      '<option value="">Year</option>';


    for (
      let y = CURRENT_YEAR;
      y >= CURRENT_YEAR - 9;
      y--
    ) {

      const option =
        document.createElement("option");

      option.value =
        String(y);

      option.textContent =
        String(y);

      el.appendChild(option);

    }


    const divider =
      document.createElement("option");

    divider.disabled =
      true;

    divider.textContent =
      "────────";

    el.appendChild(divider);


    for (
      let y = CURRENT_YEAR - 10;
      y >= 2000;
      y--
    ) {

      const option =
        document.createElement("option");

      option.value =
        String(y);

      option.textContent =
        String(y);

      el.appendChild(option);

    }

  }


  function fillSettlementYears(id) {

    const el =
      $(id);

    el.innerHTML =
      '<option value="">Year</option>';

    for (
      let y = CURRENT_YEAR - 2;
      y <= CURRENT_YEAR + 10;
      y++
    ) {

      const option =
        document.createElement("option");

      option.value =
        String(y);

      option.textContent =
        String(y);

      if (
        y === CURRENT_YEAR
      ) {
        option.selected = true;
      }

      el.appendChild(option);

    }

  }


  [
    "startDay",
    "settle1Day",
    "settle2Day"
  ].forEach(fillDays);


  fillMonths(
    "startMonth"
  );

  fillStartYears();


  [
    "settle1Month",
    "settle2Month"
  ].forEach(
    id =>
      fillMonths(
        id,
        CURRENT_MONTH
      )
  );


  [
    "settle1Year",
    "settle2Year"
  ].forEach(
    fillSettlementYears
  );

      String(
        value || ""
      ).replace(
        /[^\d]/g,
        ""
      );

    return cleaned
      ? Number(cleaned)
